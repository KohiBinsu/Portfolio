<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You!</title>
    <link rel="stylesheet" href="./portfolio.css">
    <style>
        @font-face {
            font-family: Arcadepix;
            src: url('Arcadepix Plus.ttf');
        }
        * {
            font-family: Arcadepix;
        }
        .thank-you {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-image: url('kirby.png');
            background-size: cover;
            background-position: center;
            color: white;
            padding: 20px;
        }
        .thank-you h1 {
            font-size: 48px;
            margin-bottom: 20px;
            animation: fadeIn 1s ease-in-out;
        }
        .thank-you p {
            font-size: 24px;
            margin-bottom: 30px;
            animation: fadeIn 1s ease-in-out 0.3s backwards;
        }
        .back-btn {
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            font-size: 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            animation: fadeIn 1s ease-in-out 0.6s backwards;
        }
        .back-btn:hover {
            background: white;
            color: black;
        }
        @media (max-width: 768px) {
            .thank-you h1 {
                font-size: 36px;
            }
            .thank-you p {
                font-size: 20px;
            }
            .back-btn {
                font-size: 18px;
                padding: 12px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="thank-you">
        <h1>Thank You!</h1>
        <p>Your message has been sent successfully. I'll get back to you soon!</p>
        <a href="index.html" class="back-btn">Back to Portfolio</a>
    </div>
</body>
</html>
